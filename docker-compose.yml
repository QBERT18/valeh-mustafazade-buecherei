services:
  app:
    build: .
    # Come back up if Postgres was briefly unreachable (e.g. during `docker compose restart`).
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment: &app-env
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-buecherei}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-buecherei}
      POSTGRES_DB: ${POSTGRES_DB:-buecherei}
      S3_ENDPOINT: rustfs:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-rustfsadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-rustfsadmin}
      S3_BUCKET: ${S3_BUCKET:-books}
      S3_USE_SSL: "false"
    depends_on:
      postgres:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
      # The app starts after the seed, so both never migrate at the same time.
      seed:
        condition: service_completed_successfully

  # One-shot job: fills an empty database with sample data, then exits.
  # Does nothing if there is already data, so it is safe on every `up`.
  seed:
    build: .
    command: ["buecherei", "seed"]
    environment: *app-env
    # Retry if Postgres is briefly unreachable (e.g. during `docker compose restart`).
    restart: on-failure:5
    depends_on:
      postgres:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully

  # React frontend served by nginx; it forwards /api/ to the app.
  frontend:
    build: ./frontend
    # nginx exits if "app" can't be resolved at startup; retry until it can.
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - app

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-buecherei}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-buecherei}
      POSTGRES_DB: ${POSTGRES_DB:-buecherei}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible object storage for the book files (MinIO alternative).
  rustfs:
    image: rustfs/rustfs:1.0.6
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-rustfsadmin}
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Web console
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot job: creates the bucket for the book files, then exits.
  storage-init:
    image: amazon/aws-cli:latest
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-rustfsadmin}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-rustfsadmin}
      AWS_DEFAULT_REGION: us-east-1
      S3_BUCKET: ${S3_BUCKET:-books}
    entrypoint: ["sh", "-c"]
    command:
      - >
        aws --endpoint-url http://rustfs:9000 s3api head-bucket --bucket "$$S3_BUCKET" 2>/dev/null ||
        aws --endpoint-url http://rustfs:9000 s3api create-bucket --bucket "$$S3_BUCKET"

volumes:
  postgres-data:
  rustfs-data:
